# AlphaLog PWA — Fly.io app definition
# Region iad matches the previous Vercel deployment (Washington DC).
# Crons live in a sibling app (fly.cron.toml) so a web restart never disrupts
# scheduled jobs and we can scale them independently.

app            = "alphalog-pwa"
primary_region = "iad"
kill_signal    = "SIGINT"
kill_timeout   = "15s"

[build]
  dockerfile = "Dockerfile"

[experimental]
  auto_rollback = true

[env]
  NODE_ENV               = "production"
  PORT                   = "3000"
  # Bind dual-stack IPv6+IPv4. Fly's private 6PN network (alphalog-pwa.internal)
  # routes over IPv6 only, so the cron sidecar can't reach us if Next.js standalone
  # binds 0.0.0.0 (IPv4 only). "::" tells Node to listen on the IPv6 unspecified
  # address, which on Linux also accepts mapped IPv4 connections.
  HOSTNAME               = "::"
  NEXT_TELEMETRY_DISABLED = "1"
  # Non-secret runtime config. Secrets (DATA_ENCRYPTION_KEY, VAPID_PRIVATE_KEY,
  # SUPABASE_SERVICE_ROLE_KEY, etc.) are set with `fly secrets set`.
  NEXT_PUBLIC_APP_URL          = "https://alphalog.io"
  ALPHALOG_WEB_URL             = "https://alphalog.io"
  NEXT_PUBLIC_CANONICAL_HOST   = "alphalog.io"
  NEXT_PUBLIC_SECURE_MAIL_DOMAIN = "alphalog.io"
  SECURE_MAIL_DOMAIN           = "alphalog.io"
  NEXT_PUBLIC_ENABLE_AAB       = "true"
  NEXT_PUBLIC_ENABLE_SYSTEM_LOGS = "false"
  RUNWAY_THRESHOLD_MONTHS      = "3"
  RATE_LIMIT_WINDOW_SECONDS    = "60"
  RATE_LIMIT_MAX               = "120"
  BOT_HEARTBEAT_STALE_SECONDS  = "120"
  SECURE_MAIL_MAX_EMAIL_ATTACHMENT_BYTES        = "10485760"
  NEXT_PUBLIC_SECURE_MAIL_MAX_EMAIL_ATTACHMENT_BYTES = "10485760"

[http_service]
  internal_port       = 3000
  force_https         = true
  auto_stop_machines  = "off"        # never sleep — crons + push need it warm
  auto_start_machines = true
  min_machines_running = 1
  processes           = ["app"]

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval        = "30s"
    timeout         = "5s"
    grace_period    = "20s"
    method          = "GET"
    path            = "/api/health"
    protocol        = "http"

[[vm]]
  size      = "shared-cpu-2x"
  memory    = "2gb"
  cpu_kind  = "shared"
  cpus      = 2
  processes = ["app"]

[deploy]
  strategy = "rolling"
