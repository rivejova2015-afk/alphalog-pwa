name: Coinarb Deploy

on:
  push:
    branches: [main]
    paths:
      - 'coinarb/**'
      - '.github/workflows/coinarb-deploy.yml'
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Fly deploy strategy'
        required: false
        default: 'rolling'
        type: choice
        options: [rolling, immediate, bluegreen]

concurrency:
  group: coinarb-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build + Deploy to Fly (coinarb-50x)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: coinarb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: coinarb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --run

      - name: Backtest quality gate (7d replay)
        # Skippable via "[skip-backtest]" in the commit message — only for
        # genuine emergencies (data-source outage, etc). The quality gate is
        # intentionally lax (winRate ≥ 30%, totalPnlR ≥ 0, entries ≥ 3) to
        # avoid blocking legitimate deploys early on; tighten as we
        # accumulate history.
        if: "!contains(github.event.head_commit.message, '[skip-backtest]')"
        run: |
          set -e
          npx tsx scripts/backtest.ts --days=7 --json > /tmp/backtest.txt 2>&1 || {
            echo "::warning::Backtest script failed (likely data source). Re-run with [skip-backtest] in commit message to bypass."
            cat /tmp/backtest.txt
            exit 1
          }
          tail -40 /tmp/backtest.txt
          npx tsx scripts/check-backtest-threshold.ts --file=/tmp/backtest.txt

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --app coinarb-50x \
            --strategy ${{ github.event.inputs.strategy || 'rolling' }} \
            --remote-only
