name: Coinarb Deploy

on:
  push:
    branches: [main]
    paths:
      - 'coinarb/**'
      - '.github/workflows/coinarb-deploy.yml'
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Fly deploy strategy'
        required: false
        default: 'rolling'
        type: choice
        options: [rolling, immediate, bluegreen]

concurrency:
  group: coinarb-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build + Deploy to Fly (coinarb-50x)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: coinarb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: coinarb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --run

      - name: Backtest quality gate (7d replay)
        # Skippable via "[skip-backtest]" in the commit message — only for
        # genuine emergencies (data-source outage, etc).
        #
        # The legacy `backtest.ts` runs the SMC strict pipeline only. After
        # Phase 2 of the regime-aware restructure, the live bot dispatches by
        # regime (A/B/M/P) and SMC strict only fires in RANGE_HIGH; the
        # quality gate would otherwise block every deploy in a chop market
        # because SMC opens zero positions by design. We pass `--min-entries=0`
        # so the gate becomes "if the script actually ran, accept it" — the
        # winRate / pnlR / worstRun guards still trip when entries DO occur.
        if: "!contains(github.event.head_commit.message, '[skip-backtest]')"
        run: |
          set -e
          npx tsx scripts/backtest.ts --days=7 --json > /tmp/backtest.txt 2>&1 || {
            echo "::warning::Backtest script failed (likely data source). Re-run with [skip-backtest] in commit message to bypass."
            cat /tmp/backtest.txt
            exit 1
          }
          tail -40 /tmp/backtest.txt
          npx tsx scripts/check-backtest-threshold.ts --file=/tmp/backtest.txt --min-entries=0

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        env:
          # Separate secret from FLY_API_TOKEN (which is scoped to alphalog-pwa
          # only). Create with:
          #   fly tokens create deploy --app coinarb-50x --expiry 8760h
          # then set as `FLY_API_TOKEN_COINARB` in repo secrets.
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_COINARB }}
        run: |
          flyctl deploy \
            --app coinarb-50x \
            --strategy ${{ github.event.inputs.strategy || 'rolling' }} \
            --remote-only
