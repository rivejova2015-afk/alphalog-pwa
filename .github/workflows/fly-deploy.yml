name: Fly Deploy (alphalog-pwa + alphalog-cron)

# Trigger:
#   - push a main: deploy automático del root app (web + cron)
#   - workflow_dispatch: manual con elección de strategy
#
# Skip: si el push solo toca subproyectos con su propio deploy
# (coinarb/, polyarb/, lattice-desktop/, bots/) o assets sin impacto.
#
# Pre-built strategy (ver Dockerfile): el `npm run build` corre en el runner
# de GitHub (16GB+ RAM) porque el Depot de Fly hace OOM con next build.
# El Dockerfile solo COPY de .next/standalone + .next/static.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'coinarb/**'
      - 'polyarb/**'
      - 'lattice-desktop/**'
      - 'bots/**'
      - '**.md'
      - '.github/workflows/coinarb-deploy.yml'
      - '.github/workflows/quality-gate.yml'
      - '.github/workflows/heartbeat.yml'
      - '.github/workflows/cme-crons.yml'
      - '.github/workflows/bot-*.yml'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Fly deploy strategy'
        required: false
        default: 'rolling'
        type: choice
        options: [rolling, immediate, bluegreen]
      skip_web:
        description: 'Skip web deploy (only cron)'
        required: false
        default: false
        type: boolean
      skip_cron:
        description: 'Skip cron deploy (only web)'
        required: false
        default: false
        type: boolean

# Lock: never let two deploys overlap. cancel-in-progress=false porque si ya
# hay un deploy corriendo, mejor que termine antes de empezar el siguiente
# (Fly's rolling strategy ya maneja el zero-downtime, pero overlapping flyctl
# invocations pueden confundir el release tracker).
concurrency:
  group: fly-deploy-alphalog
  cancel-in-progress: false

jobs:
  # ============================================================================
  # WEB: alphalog-pwa (Next.js standalone)
  # ============================================================================
  deploy-web:
    name: Build + Deploy web (alphalog-pwa)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_web != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (pre-built strategy for Fly)
        # Genera .next/standalone + .next/static. Sin esto, el COPY en
        # Dockerfile falla con "no such file".
        #
        # IMPORTANTE: las NEXT_PUBLIC_* se inlinean en BUILD-TIME en el bundle
        # del browser. Si faltan acá, el JS compilado lleva `undefined` literal
        # y los `fly secrets` del runtime NO las rescatan (esos solo aplican a
        # process.env del server, no al bundle ya generado). Cada secret de
        # GitHub debe existir en Repo → Settings → Secrets and variables → Actions.
        #
        # Las SENTRY_* (sin NEXT_PUBLIC_) son build-time del plugin para subir
        # source maps al release. Sin SENTRY_AUTH_TOKEN el build pasa pero los
        # stack traces en producción salen minificados.
        env:
          # Supabase (browser client + RLS)
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Push notifications (VAPID public key, browser-visible)
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          # Captcha en /auth/page.tsx
          NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_HCAPTCHA_SITE_KEY }}
          # URLs canónicas (sitemap, security headers, secure mail)
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CANONICAL_HOST: ${{ secrets.NEXT_PUBLIC_CANONICAL_HOST }}
          NEXT_PUBLIC_SECURE_MAIL_DOMAIN: ${{ secrets.NEXT_PUBLIC_SECURE_MAIL_DOMAIN }}
          NEXT_PUBLIC_SECURE_MAIL_MAX_EMAIL_ATTACHMENT_BYTES: ${{ secrets.NEXT_PUBLIC_SECURE_MAIL_MAX_EMAIL_ATTACHMENT_BYTES }}
          # Feature flags (browser-side checks en featureFlags.ts)
          NEXT_PUBLIC_ENABLE_AAB: ${{ secrets.NEXT_PUBLIC_ENABLE_AAB }}
          NEXT_PUBLIC_ENABLE_SYSTEM_LOGS: ${{ secrets.NEXT_PUBLIC_ENABLE_SYSTEM_LOGS }}
          NEXT_PUBLIC_ENABLE_SW: ${{ secrets.NEXT_PUBLIC_ENABLE_SW }}
          # Version stamp para debugBundle + SystemDiagnostics
          NEXT_PUBLIC_BUILD_VERSION: ${{ github.sha }}
          # Sentry — DSNs (runtime) + auth para upload de source maps (build)
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly (alphalog-pwa)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --app alphalog-pwa \
            --config fly.toml \
            --strategy ${{ inputs.strategy || 'rolling' }} \
            --remote-only \
            --wait-timeout 300

  # ============================================================================
  # CRON: alphalog-cron (supercronic sidecar) — paralelo con web
  #
  # NOTE (2026-06): el secret FLY_API_TOKEN configurado en GitHub tiene scope
  # solo sobre `alphalog-pwa`, no `alphalog-cron`. Hasta que se actualice
  # con un token de organización (https://fly.io/user/personal_access_tokens
  # → Create org-scoped token), este job no puede pushear el cron al registry.
  # `continue-on-error: true` evita marcar el run completo como rojo cada vez
  # que se mergea algo a main. El cron sidecar tiene un Dockerfile estable
  # (descarga supercronic + COPY crontab) que rara vez cambia — los pocos
  # cambios al crontab se aplican con un deploy manual via flyctl desde la
  # máquina del dev. Quitar `continue-on-error: true` cuando el token se
  # actualice y este job vuelva a pasar.
  # ============================================================================
  deploy-cron:
    name: Deploy cron sidecar (alphalog-cron)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_cron != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy cron to Fly (alphalog-cron)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --app alphalog-cron \
            --config fly.cron.toml \
            --dockerfile Dockerfile.cron \
            --strategy ${{ inputs.strategy || 'immediate' }} \
            --remote-only \
            --wait-timeout 180

  # ============================================================================
  # SUMMARY: reporta el estado combinado pero solo falla si el WEB falla.
  # El cron tiene continue-on-error y su failure se loggea pero no rompe el run.
  # ============================================================================
  deploy-summary:
    name: Deploy Summary
    needs: [deploy-web, deploy-cron]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          web="${{ needs.deploy-web.result }}"
          cron="${{ needs.deploy-cron.result }}"
          echo "Web deploy:  $web"
          echo "Cron deploy: $cron"
          if [[ "$cron" == "failure" ]]; then
            echo "::warning::Cron deploy failed — known issue with FLY_API_TOKEN scope. Run \`flyctl deploy --app alphalog-cron\` manually if the crontab changed."
          fi
          # Only WEB failure breaks the run. Cron is best-effort until the
          # token is updated.
          if [[ "$web" == "failure" ]]; then
            echo "::error::Web deploy failed."
            exit 1
          fi
          echo "All requested deploys succeeded."
