name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run Playwright E2E tests"
        required: false
        default: false
        type: boolean

jobs:
  lint_and_build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Security gate (audit 2026-06, Área 10): fail the build on any CRITICAL
      # dependency vulnerability. Kept at `critical` for now because the build
      # tree still carries `high` advisories via the unmaintained next-pwa chain
      # (tracked for migration to Serwist). Raise to `high` once that lands.
      - name: Security audit (fail on critical)
        run: npm audit --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # Dummy values: el build de Next.js intenta hacer SSG de páginas
          # auth-gated (p. ej. /dashboard/bot-control) que invocan
          # createBrowserClient() en useMemo durante el prerender del shell.
          # Sin estas vars, @supabase/ssr lanza durante `next build`.
          # Las claves reales no se usan — sólo se requiere que el cliente
          # se construya; los selects nunca se ejecutan en prerender porque
          # están en useEffect.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2e == true }}
    needs: lint_and_build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        run: npm run test:e2e
