name: Dead Man's Switch — Heartbeat

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping heartbeat endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.ALPHALOG_WEB_URL }}/api/health/heartbeat")
          echo "Response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Heartbeat failed with status $STATUS"
            exit 1
          fi
